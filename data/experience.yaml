- title: "Systems Engineer"
  org: "Carrenza"
  from: 2013-09
  to: 2016-03
  summary: "I joined as a graduate systems engineer, working hands-on across customer VMware, Linux and Windows estates."
  publish_summary: true
  outcomes:
    - text: "Managed configuration and orchestration with Chef and Ansible across customer estates"
      attribution: "Led"
      lenses: [hands-on]
      capabilities: [engineering, automation]
      publish: true
      highlight: true
    - text: "Rebuilt our Nagios instances as part of a wider hardening project, moving to SNMPv3 and splitting a central instance into isolated ones without losing a single view of alerting, and saw the rebuild through to completion"
      attribution: "Contributed"
      lenses: [hands-on]
      capabilities: [monitoring, security]
      publish: true
    - text: "Evaluated open-source monitoring alternatives including Zabbix and Icinga, built a proof of concept, and settled on Thruk with the Livestatus API as one front end across our existing Nagios instances"
      attribution: "Contributed"
      lenses: [hands-on]
      capabilities: [monitoring, platform-transformation]
      publish: true
    - text: "Helped a customer's website scale for big launches using configuration management, after it buckled under peak load in my first weeks on call"
      attribution: "Contributed"
      lenses: [hands-on]
      capabilities: [automation, engineering]
      publish: true
  learnt:
    - text: "My first big outage on call taught me when to ask for help, how to keep a customer updated under pressure, and what can safely wait until Monday"
      kind: lesson
      lenses: [hands-on]
      capabilities: [major-incident]
      publish: true
    - text: "Early cloud taught me that customers should pay for capacity only when they need it. Once they could deploy through an API themselves, a managed service could be layered to suit each one, from infrastructure only to fully managed."
      kind: lesson
      lenses: [operating-model]
      capabilities: [cloud, service-design]
      publish: true
    - text: "From painful experience, always take a dated backup before any change. Then compare it with the result and write the change back into configuration management code like Chef or Ansible, so the next run doesn't undo it."
      kind: skill
      lenses: [hands-on]
      capabilities: [engineering, automation]
      publish: true
      highlight: true
    - text: "Designing for predictable results through idempotency, which I still apply well beyond servers"
      kind: skill
      lenses: [hands-on, operating-model]
      capabilities: [automation, engineering]
      publish: true
    - text: "Pragmatism beats complexity. A light open-source front end gave us one view of every monitoring instance without a costly rebuild."
      kind: lesson
      lenses: [hands-on, operating-model]
      capabilities: [monitoring]
      publish: true
    - text: "Linux at scale and VMware, learnt on the job from generous senior engineers"
      kind: skill
      lenses: [hands-on]
      capabilities: [engineering]
      publish: true
    - text: "You get out what you put in, and it's always better to work in a great team"
      kind: lesson
      lenses: [operating-model]
      capabilities: [people]
      publish: true
