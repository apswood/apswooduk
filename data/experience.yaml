# Attribution must be one of: Led, Co-led, Contributed, Supported. Outcomes only.
# Only outcomes with publish: true are rendered. lenses: operating-model | hands-on.
# highlight (optional): true puts the outcome in the default Highlights theme on the Experience page.
# publish_summary: the role summary renders only when this is true.
# status (optional): only for pilots and proofs of concept.
# learnt (optional, per role): what I took away from the role.
#   kind: skill | lesson. learnt items carry no attribution, because they are mine by definition.
#   Only items with publish: true are rendered. highlight: true adds the item to Highlights, at most one per role.
#   Lessons never name customers or criticise former colleagues or leaders.
# Approved for publication by Andrew, 22 Oct 2026. Figures and team sizes are deliberately kept generic.
# learnt items, new outcomes and publish flags approved by Andrew, 24 Oct 2026.

- title: "Head of Technical Delivery"
  org: "Six Degrees"
  from: 2022-05
  summary: "I lead a function created in 2022 when managed services was split in two, covering second and third line Cloud, Data, Connectivity, Unified Comms and Workplace support. The team spans onshore and offshore locations, with one layer of team leads."
  publish_summary: true
  outcomes:
    - text: "Converged separate technical teams into one blended operating model while holding live SLAs"
      attribution: "Led"
      lenses: [operating-model]
      capabilities: [operating-model, service-delivery]
      publish: true
      highlight: true
    - text: "Designed and embedded a proactive problem management framework, applied across a large managed customer base, with an engineer kept in the loop where automation cannot decide"
      attribution: "Led"
      lenses: [operating-model, hands-on]
      capabilities: [problem-management, automation]
      publish: true
    - text: "Worked with Professional Services leadership to formalise how customer requests move between support and projects, writing the principles and building an AI-assisted triage workflow with decisions kept with people"
      attribution: "Co-led"
      lenses: [operating-model]
      capabilities: [operating-model, service-design, ai-with-oversight]
      publish: true
    - text: "Designed and built a knowledge-base pipeline using Python and AI-assisted coding against Cosmos DB and Azure AI Search"
      attribution: "Led"
      status: "Proof of concept, piloted, not rolled out"
      lenses: [hands-on]
      capabilities: [automation, ai-with-oversight]
      publish: true
    - text: "Out-of-hours major incident manager and senior escalation point, and technical lead for zero-day assessments on the vulnerability management committee"
      attribution: "Led"
      lenses: [hands-on]
      capabilities: [major-incident, cyber-recovery]
      publish: true
      highlight: true
    - text: "Championed proactive automation that contributed to a steady run of improvements and a reduction in major outages"
      attribution: "Contributed"
      lenses: [operating-model]
      capabilities: [automation, service-delivery]
      publish: true
    - text: "Mentored engineers across complex hybrid platforms and built a culture of psychological safety, so people feel able to learn, ask and try things without fear"
      attribution: "Led"
      lenses: [operating-model]
      capabilities: [leadership, people]
      publish: true
    - text: "Contributed to bid responses and service design, aligning technical architecture proposals with commercial strategy"
      attribution: "Contributed"
      lenses: [operating-model]
      capabilities: [service-design, commercial]
      publish: true
    - text: "Recognised with Above and Beyond awards and company all-hands mentions for leadership in vulnerability management and incident response"
      attribution: "Led"
      lenses: [hands-on]
      capabilities: [major-incident, security, leadership]
      publish: true
    - text: "Helping drive a sustained improvement in customer satisfaction scores"
      attribution: "Contributed"
      lenses: [operating-model]
      capabilities: [service-delivery]
      publish: true
  learnt:
    - text: "People cope better with a difficult decision than an unclear one"
      kind: lesson
      lenses: [operating-model]
      capabilities: [leadership, people, operating-model]
      publish: true
      highlight: true
    - text: "Successful backups and successful recovery are not the same thing"
      kind: lesson
      lenses: [hands-on]
      capabilities: [cyber-recovery, major-incident]
      publish: true
    - text: "I naturally look for the best in people and try to help them improve. I've also learnt that when someone is in the wrong role, or the organisation has moved on and they haven't, you have to move quickly. Form has to follow function."
      kind: lesson
      lenses: [operating-model]
      capabilities: [leadership, people]
      publish: true
    - text: "Get the data somewhere trustworthy first, then automate on top of it"
      kind: skill
      lenses: [hands-on, operating-model]
      capabilities: [automation, ai-with-oversight]
      publish: true
    - text: "Governing AI is less about restricting people than giving them safe tools that are easier to use than the alternatives"
      kind: lesson
      lenses: [operating-model]
      capabilities: [ai-with-oversight]
      publish: true
    - text: "Moving to a proactive service model taught me that the hardest thing to shift is mindset, not process"
      kind: lesson
      lenses: [operating-model]
      capabilities: [problem-management, operating-model]
      publish: false
    - text: "Most ticket problems come from workload and poor visibility, not poor intentions, so visibility works better than more oversight"
      kind: lesson
      lenses: [operating-model]
      capabilities: [service-delivery, leadership]
      publish: false
    - text: "Advising leaders is about evidence and risk, not winning the argument"
      kind: lesson
      lenses: [operating-model]
      capabilities: [leadership]
      publish: false

- title: "Head of Managed Services"
  org: "Six Degrees"
  from: 2021-05
  to: 2022-05   # ends where Head of Technical Delivery begins
  summary: "I brought legacy technical teams together into one proactive managed services operating model, moving towards ITIL-aligned governance and modern monitoring and cross-skilling engineers for hybrid infrastructure."
  publish_summary: true
  outcomes:
    - text: "Provided technical leadership through the consolidation of multiple monitoring tools onto LogicMonitor, driving migration completion and the retirement of legacy platforms"
      attribution: "Co-led"
      lenses: [operating-model, hands-on]
      capabilities: [platform-transformation, monitoring]
      publish: true
      highlight: true
    - text: "Kept hands-on accountability for tier-three major incident escalations through a team realignment to protect live SLAs"
      attribution: "Led"
      lenses: [hands-on]
      capabilities: [major-incident, service-delivery]
      publish: true
    - text: "Provided technical evidence supporting the company's Microsoft Azure Expert MSP status (2021)"
      attribution: "Contributed"
      lenses: [hands-on]
      capabilities: [cloud]
      publish: true
    - text: "Harmonised the morning stand-ups across teams around common goals, and refreshed objectives so they linked to wider organisational goals"
      attribution: "Led"
      lenses: [operating-model]
      capabilities: [operating-model, leadership]
      publish: true
  learnt:
    - text: "Moving to managing managers meant delegating more and coaching each person differently. Some were strongest on the people side and others on delivery, so I brought those strengths together and encouraged people to learn from each other across teams."
      kind: skill
      lenses: [operating-model]
      capabilities: [leadership, people]
      publish: true
    - text: "Teams can keep their own routines as long as they share the same goals"
      kind: lesson
      lenses: [operating-model]
      capabilities: [operating-model, leadership]
      publish: true
    - text: "Data and objectives have to line up, with dashboards to work from. Not having them was what made the case for transforming our monitoring."
      kind: lesson
      lenses: [operating-model]
      capabilities: [monitoring, platform-transformation]
      publish: true
    - text: "Accurate monitoring can make a service look worse before it gets better, because it exposes what the old tools were hiding"
      kind: lesson
      lenses: [hands-on, operating-model]
      capabilities: [monitoring, platform-transformation]
      publish: true
      highlight: true

- title: "Centre of Excellence Manager, Secure and Public Sector"
  org: "Six Degrees"
  from: 2020-01
  to: 2021-05
  summary: "I ran technical escalations and support for secure public sector cloud environments under UK OFFICIAL and NCSC guidance, including secure VDI on VMware Horizon, VMware vCloud and PSN networks, bridging platform build and live service."
  publish_summary: true
  outcomes:
    - text: "Built 24x7 hypercare monitoring for critical national public sector platforms through peak periods"
      attribution: "Led"
      lenses: [operating-model, hands-on]
      capabilities: [regulated, service-transition]
      publish: true
      highlight: true
    - text: "Owned technical remediation for penetration testing, ITHC, ISO 27001 and SOC 2 for central government and secure clients"
      attribution: "Led"
      lenses: [hands-on]
      capabilities: [regulated, security]
      publish: true
    - text: "Hardened Linux and Solaris base images against CIS benchmarks, and designed secure bridging and proxy architecture later signed off through external accreditation"
      attribution: "Led"
      lenses: [hands-on]
      capabilities: [security, engineering]
      publish: true
    - text: "Rebuilt load-balancer configuration and helped restore service during a prolonged hosting outage on end-of-life infrastructure"
      attribution: "Co-led"
      lenses: [hands-on]
      capabilities: [major-incident, engineering]
      publish: true
  learnt:
    - text: "We had built our internal platforms close to zero trust before 2020, so moving to remote working was the easy part. Managing people remotely was the hardest."
      kind: lesson
      lenses: [operating-model]
      capabilities: [security, people]
      publish: true
    - text: "A workaround under pressure has to be checked against every tenant on shared infrastructure"
      kind: lesson
      lenses: [hands-on]
      capabilities: [major-incident]
      publish: true
      highlight: true
    - text: "Working to external accreditation, from ISO 27001 and SOC 2 to ITHC and NCSC guidance"
      kind: skill
      lenses: [hands-on]
      capabilities: [regulated, security]
      publish: true
    - text: "The real cost of running unsupported end-of-life infrastructure is the customer's confidence afterwards, not the outage"
      kind: lesson
      lenses: [hands-on]
      capabilities: [engineering, major-incident]
      publish: false
    - text: "Recovery needs specialist depth and knowledge of the estate and its customers, working together"
      kind: lesson
      lenses: [hands-on]
      capabilities: [major-incident]
      publish: false

- title: "Service Desk Manager"
  org: "Carrenza"
  from: 2017-02
  to: 2020-01
  summary: "I ran the consolidated service desk through Carrenza's integration into Six Degrees, as the main technical escalation point across networking, servers and VMware. That included peak-load support for major ecommerce sites and televised charity events."
  publish_summary: true
  outcomes:
    - text: "Migrated the service desk onto ServiceNow during the integration, carrying across customer contacts, SLAs and the knowledge base"
      attribution: "Led"
      lenses: [hands-on]
      capabilities: [service-transition, itsm]
      publish: true
      highlight: true
    - text: "Sustained SLA performance through the integration into Six Degrees"
      attribution: "Led"
      lenses: [operating-model]
      capabilities: [service-delivery]
      publish: true
  learnt:
    - text: "Bringing a small, scrappy team into a larger, more structured organisation means keeping what made them good while taking on the structure"
      kind: lesson
      lenses: [operating-model]
      capabilities: [leadership, people, service-transition]
      publish: true
    - text: "High-traffic events are won in the preparation. We ran 24/7 cover for days at a time without a dedicated 24/7 team, so everyone needed a runbook, a shift they had agreed to, the right contacts and regular checkpoints. Any new tool or third party went into that plan too, because that's often where the surprises came from."
      kind: skill
      lenses: [operating-model]
      capabilities: [service-transition, regulated]
      publish: true
      highlight: true

