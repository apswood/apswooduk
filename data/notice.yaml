title: "STAFF NOTICE"
lines:
  - "Please read the following carefully. It applies with immediate effect and to everyone."
  - "1. The stapler on the second desk belongs to the team. It is therefore to be returned to the second desk, and not to the person who last needed it."
  - "2. Mugs must be labelled with the owner's name and the date of last washing. An unlabelled mug will be treated as communal and, regrettably, as evidence."
  - "3. The desk fan may be borrowed with a written request to the Team Leader (acting). The chain of command for the fan is as follows: the borrower, then the Team Leader (acting), then the fan."
  - "Thank you for your cooperation."
  - "Signed, Team Leader (acting)"
