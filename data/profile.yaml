name: "Andrew Wood"
headline: "Technical Operations & Engineering Leadership"
summary:
  - "I lead technical delivery for a UK managed service provider, running second and third line support across cloud, data, connectivity, unified communications and workplace platforms."
  - "I have grown into leadership over 13 years, from systems engineer to head of function, and I stay hands-on in third-line escalations and major incidents where it matters most."
  - "Most of my work sits on the seam between project delivery and live service, and on using data and automation to move support from reactive to proactive."
about:
  - "I have an incurable urge to look under the bonnet of how things work. Hand me a railway diagram and I'm instantly hooked on the choreography of routing and signalling that keeps chaos at bay. Hand me the morning news and I'm tracing the cogs turning behind the headlines."
  - "That itch has powered thirteen years of wrangling cloud, network and voice platforms, and it doesn't stop when the laptop closes. Away from work you may find me wrestling with a piano or saxophone, brushing up my Spanish for the fun of it, or sitting down with a good film, especially one with a sharp wit. My playlists wander from jazz and alt-rock to Latin grooves and cinematic downtempo electronic. Travel tends to turn into an architecture tour, which probably explains my soft spot for the clean lines of Scandinavian minimalism."
  - "It all comes back to the same habit. Work out how something fits together well enough and you can make it work for the people who rely on it. That goes for a resilient network as much as a well-timed piece of satire."
beliefs: "Operational success rests on genuine relationships, structured problem-solving and collaboration. Digital infrastructure underpins social and economic progress, so it has to be dependable and available."
location: "London"
