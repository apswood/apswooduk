version: 1
# AWS Amplify Hosting build. This file takes precedence over the build command set in the console.
# It installs a pinned Hugo, runs the same checks as CI, then builds. A failed check fails the build,
# so nothing is deployed.
frontend:
  phases:
    build:
      commands:
        - |
          set -e
          HUGO_VERSION=0.168.0
          HUGO_SHA256=787f100057328824f38c6ad7c87ff10d6451ae0a7bc39cedaad0dd2bcde17e53
          curl -sSL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/hugo-bin" && tar -xzf hugo.tar.gz -C "$HOME/hugo-bin" hugo && rm hugo.tar.gz
          export PATH="$HOME/hugo-bin:$PATH"
          hugo version
          bash scripts/test-publish-gate.sh
          bash scripts/prepublish-check.sh
          hugo --minify --gc
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths: []
